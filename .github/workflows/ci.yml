name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
      - name: End to end run on synthetic data
        run: python scripts/run_experiments.py --synthetic --out-dir /tmp/results --fig-dir /tmp/figures
