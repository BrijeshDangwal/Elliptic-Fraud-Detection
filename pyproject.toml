[project]
name = "elliptic-fraud-detection"
version = "0.1.0"
description = "Illicit Bitcoin transaction detection on the Elliptic dataset with temporal evaluation and graph features"
authors = [{ name = "Brijesh Dangwal" }]
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
